<div class="container mt-5">
    <h3><b>Todo CRUD</b></h3>
    <div class="row">
        <div class="col-md-12">
            <div class="card">
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-5">
                            <div class="card shadow">
                                <div class="card-body">
                                    <h3 class="text-center"><b> {{isInEditMode ? 'Update Todo' : 'Add Todo'}} </b></h3>

                                    <label for="todoItem"><b>Todo Item</b></label>
                                    <input #todoItemRef class="form-control mb-4" type="text" id="todoItem">

                                    <label for="isCompleted"><b>Is Completed</b></label>
                                    <select #isCompletedRef class="form-control mb-4" id="isCompleted">
                                        <option value="yes">Yes</option>
                                        <option value="no">No</option>
                                    </select>

                                    <button (click)="onAddnewTodo()" *ngIf="!isInEditMode; else updateButton" class="btn btn-primary w-100">Add Todo</button>
                                    <ng-template #updateButton>
                                        <button (click)="onUpdateTodo()" class="btn btn-primary w-100">Update Todo</button> 
                                    </ng-template>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-5 offset-md-2 mt-5">
                            <div class="card">
                                <div class="card-body">
                                    <div class="card mt-2" *ngFor="let todo of todos">
                                        <div class="card-body d-flex justify-content-between">
                                            <div class="d-flex justify-content-between">
                                                <input (change)="onChangeChecked(todo, $event)" #checkboxRef style="width: 15px; height: 15px;" class="me-2 mt-2" [checked]="todo.isCompleted" type="checkbox">
                                                 <h4> {{todo.todoItem}} </h4>
                                            </div>
                                           

                                            <div class=" d-flex justify-content-between">
                                                
                                                    <button (click)="onEditTodo(todo)" class="me-3" mat-icon-button mat-mini-fab color="primary">
                                                        <mat-icon>edit</mat-icon>
                                                    </button>
                                                
                                                    <button (click)="onDeleteTodo(todo.id)" mat-mini-fab color="warn">
                                                        <mat-icon>delete</mat-icon>
                                                    </button>
                                                
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
