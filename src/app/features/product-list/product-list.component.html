<div class="container-fluid">
    <div class="row">
        <div class="col-md-12">
            <div class="card">
                <div class="card-body">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Product Name</th>
                                <th>Category</th>
                                <th>Price</th>
                                <th>Quantity</th>
                                <th>Edit</th>
                                <th>Remove</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr *ngFor="let product of products; let i = index">
                                <td> {{i + 1}} </td>
                                <td> {{product.pName}} </td>
                                <td> {{product.category}} </td>
                                <td> {{product.price}} </td>
                                <td> {{product.quantity}} </td>
                                <td class="text-center">

                                    <button (click)="onEdit(product)" mat-raised-button mat-mini-fab color="primary">
                                        <mat-icon>edit</mat-icon>
                                    </button>

                                </td>
                                <td class="text-center">
                                     <button 
                                     [disabled]="disableDeleteButton === product.id"
                                     (click)="onRemove(product.id)" mat-raised-button mat-mini-fab color="warn">
                                    <mat-icon>delete</mat-icon>
                                </button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
