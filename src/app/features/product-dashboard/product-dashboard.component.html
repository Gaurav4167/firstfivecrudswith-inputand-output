
<div class="container">
    <div class="row">
        <div class="col-md-6">
            <app-product-form
            [editedProduct]="editedProduct"
            (emitNewProduct)="onAddNewProduct($event)"
            (emitUpdatedProduct)="onUpdateProduct($event)"
            > </app-product-form>
        </div>
        <div class="col-md-6">
            <app-product-list
            [products]="productsArr"
            (emitEditPrd)="onEditProduct($event)"
            (emitRemoveId)="removeProduct($event)"
            >
            </app-product-list>
        </div>
    </div>
</div>
