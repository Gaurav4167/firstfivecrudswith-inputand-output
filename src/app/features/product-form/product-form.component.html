<div class="container">
    <div class="row">
        <div class="col-md-12">
            <div class="card card-body">
                <div>
                    <h3 class="mb-3">
                        {{isInEditMode ? 'Update Product' : 'Add Product'}}
                    </h3>
                </div>
                <form #formRef="ngForm" (ngSubmit)="onAddNewProduct()">
                    <label for="pName"><b>Product Name</b></label>
                    <input id="pName" 
                    name="pName"
                    ngModel
                    class="form-control mb-4" type="text" placeholder="e.g Laptop">


                    <label for="category"><b>Category</b></label>
                    <select id="category" class="form-control mb-4" name="category" ngModel>
                        <option value='Electronics' > Electronics</option>
                        <option value='Clothing'>Clothing</option>
                        <option value="Plastic">Plastic</option>
                        <option value="Furniture">Furniture</option>
                        <option value="Accessories">Accessories</option>
                    </select>

                    <label for="price"><b>Price</b></label>
                    <input id="price" class="form-control mb-4" type="number"
                    name="price" 
                    ngModel
                    placeholder="00000">


                    <label for="quantity"><b>Quantity</b></label>
                    <input id="quantity" class="form-control mb-4" type="number"
                    name="quantity"
                    ngModel
                     placeholder="0000">

                    <button *ngIf="!isInEditMode; else showUpdateButton" class="btn btn-primary w-100">Add
                        Product</button>

                    <ng-template #showUpdateButton>
                        <button type="button" (click)="onUpdate()" class="btn btn-primary w-100">Update Product</button>
                    </ng-template>
                </form>
            </div>
        </div>
    </div>
</div>
