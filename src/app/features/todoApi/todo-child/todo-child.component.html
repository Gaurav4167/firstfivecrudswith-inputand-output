<div class="container">
    <div class="row">
        <div class="col-md-12">
            <div class="card">
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-5">
                            <h3>
                                <strong>
                                    {{isInEditMode ? 'Update Todo' : 'Add Todo'}}
                                </strong>
                            </h3>
                            <label for="title"><strong>Title</strong></label>
                            <input #titleRef class="form-control mb-3" id="title" type="text">

                            <label for="isCompleted"><strong>isCompleted</strong></label>
                            <select #isCompltedRef class="form-control mb-3" name="" id="isCompleted">
                                <option value="yes">Yes</option>
                                <option value="no">No</option>
                            </select>

                            <button (click)="addNewTodo()" *ngIf="!isInEditMode; else showUpdateButton" class="btn btn-primary w-100">Add
                                Todo</button>

                            <ng-template #showUpdateButton>
                                <button (click)="updateTodo()" class="btn btn-primary w-100">Update Todo</button>
                            </ng-template>
                        </div>
                        <div class="col-md-5 offset-md-2">
                            <div class="card">
                                <div class="card-body">
                                    <div class="row">
                                        <div class="col-md-12 mt-2" *ngFor="let todos of todosArr">
                                            <div class="card">
                                                <div
                                                    class="card-body d-flex justify-content-between align-items-center">
                                                    <div class="d-flex justify-content-between w-60">
                                                        <input class="me-2" type="checkbox" [checked]="todos.completed">
                                                        <h5 class="w-100">
                                                            {{todos.title}}
                                                        </h5>
                                                    </div>
                                                    <div class="">
                                                        <button (click)="editTodo(todos)" class="me-2" mat-raised-button mat-mini-fab
                                                            color="primary">
                                                            <mat-icon>edit</mat-icon>
                                                        </button>
                                                        <button (click)="deleteTodo(todos.id)" mat-raised-button mat-mini-fab color="warn">
                                                            <mat-icon>delete</mat-icon>
                                                        </button>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
